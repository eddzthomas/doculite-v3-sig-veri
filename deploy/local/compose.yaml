# DEV ONLY local stack. Images pinned by digest to deploy/upstream-versions.json.
# Never referenced by customer deployment tooling; no real customer data, ever.
services:
  postgres:
    image: docker.io/library/postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: doculite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperless
    volumes:
      # postgres 18+ images moved the data dir: mount the parent so the
      # image can manage its versioned data subdirectory (docker-library PR 1259)
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-8101}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doculite -d paperless"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis:
    image: docker.io/library/redis@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    ports:
      - "127.0.0.1:${REDIS_PORT:-8102}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx@sha256:aa810a36942c63d4ee70d00eda7236cd3d6acfb7eb3f7987fb568ed14df8817a
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: doculite
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_CONSUMER_POLLING: "5"
    ports:
      - "127.0.0.1:${PAPERLESS_PORT:-8100}:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/api/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  docuseal:
    image: docker.io/docuseal/docuseal@sha256:a8f063f916e39fe326af62111f875200c171ea1f5c6902f3b39f634b9549a3ef
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://doculite:${POSTGRES_PASSWORD}@postgres:5432/docuseal
    ports:
      - "127.0.0.1:${DOCUSEAL_PORT:-8200}:3000"
    volumes:
      - docuseal-data:/data
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 in this image while
      # the app binds IPv4 0.0.0.0 only (live-verified; /up answers 200 there)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  pgdata:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  docuseal-data:
